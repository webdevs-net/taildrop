<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TailDrop">
  <title>TailDrop — drop in front of the mark</title>
  <!-- Proportions taken from Tailscale's own mark: 3x3 at 15/24/33 r=3 on a 48
       canvas, four dots forming the "t", the rest faded. Scaled to 256. -->
  <defs>
    <path id="d" d="M128 112 C128 112 162 148 162 166 A34 34 0 1 1 94 166 C94 148 128 112 128 112 Z"/>
    <mask id="g">
      <rect width="256" height="256" fill="#fff"/>
      <use href="#d" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#g)">
  <g fill="#1A1A1A">
    <circle cx="80" cy="128" r="16"/>
    <circle cx="176" cy="128" r="16"/>
  </g>
  <g fill="#1A1A1A" opacity=".3">
    <circle cx="80" cy="80" r="16"/>
    <circle cx="128" cy="80" r="16"/>
    <circle cx="176" cy="80" r="16"/>
    <circle cx="80" cy="176" r="16"/>
    <circle cx="176" cy="176" r="16"/>
  </g>
  </g>
  <use href="#d" fill="#2F6FED"/>
</svg>
