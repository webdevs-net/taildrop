<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TailDrop">
  <title>TailDrop — drop over the corner of the grid</title>
  <!-- The 3x3 node grid behind, the droplet in front. Dots the droplet would
       clip are left out entirely rather than shaved into slivers, and the gap
       is the droplet path stroked, so the clear space is even all round. -->
  <defs>
    <path id="dropF" d="M186 136 C186 136 220 174 220 194 A34 34 0 1 1 152 194 C152 174 186 136 186 136 Z"/>
    <mask id="gapF">
      <rect width="256" height="256" fill="#fff"/>
      <use href="#dropF" fill="#000" stroke="#000" stroke-width="18" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g fill="#1A1A1A" mask="url(#gapF)">
    <circle cx="56" cy="56" r="18"/>
    <circle cx="128" cy="56" r="18"/>
    <circle cx="200" cy="56" r="18"/>
    <circle cx="56" cy="128" r="18"/>
    <circle cx="128" cy="128" r="18"/>
    <circle cx="200" cy="128" r="18"/>
    <circle cx="56" cy="200" r="18"/>
  </g>

  <use href="#dropF" fill="#2F6FED"/>
</svg>
